<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta name="theme-color" content="#0d0d12" />

  <title>Elemento do Frio RPG</title>

  <script src="https://cdn.tailwindcss.com/3.4.17"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@400;600;700&family=Cinzel:wght@400;700;900&family=Mukta:wght@300;400;600;700&family=Exo+2:wght@400;600;700&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="styles.css" />
</head>

<body class="h-full">

  <!-- LOGIN -->
  <div id="login-screen" class="login-screen">

    <div class="login-card">

      <h1 class="login-title">
        Elemento do Frio
      </h1>

      <p class="login-subtitle">
        Entre para acessar sua ficha e árvore de habilidades
      </p>

      <input
        id="email"
        class="login-input"
        type="email"
        autocomplete="email"
        placeholder="Email"
      />

      <input
        id="password"
        class="login-input"
        type="password"
        autocomplete="current-password"
        placeholder="Senha"
      />

      <button
        onclick="login()"
        class="login-button"
      >
        Entrar
      </button>

      <p
        id="login-error"
        class="login-error"
      ></p>

    </div>

  </div>


  <!-- APP -->
  <div
    id="app"
    class="h-full flex flex-col overflow-auto scroll-container hidden"
  >

    <!-- HEADER -->
    <header class="app-header">

      <div class="topbar">

        <div class="topbar-left">

          <div class="header-identity">

            <div
              id="header-avatar"
              class="header-avatar"
              aria-hidden="true"
            >
              <span>?</span>
            </div>

            <div class="header-title-wrap">

              <h1
                id="page-title"
                class="page-title"
              >
                Árvore de Habilidades
              </h1>

              <p
                id="user-label"
                class="user-label"
              ></p>

            </div>

          </div>

        </div>


        <div class="topbar-right">

          <!-- CONTROLE DO MESTRE -->
          <div
            id="admin-panel"
            class="hidden admin-panel"
          >

            <label
              for="player-select"
              class="admin-label"
            >
              Jogador:
            </label>

            <select
              id="player-select"
              onchange="loadSelectedPlayer()"
              class="admin-select"
            ></select>

          </div>


          <button
            onclick="logout()"
            class="logout-btn"
          >
            Sair
          </button>

        </div>

      </div>


      <p class="header-subtitle">
        Selecione um elemento para visualizar as habilidades
      </p>

    </header>


    <!-- NAVEGAÇÃO -->
    <nav id="tabs-nav">

      <div
        id="tabs-container"
        class="flex gap-2 overflow-x-auto scroll-container"
      ></div>

    </nav>


    <!-- CONTEÚDO -->
    <main
      id="main-content"
      class="flex-1 overflow-auto scroll-container"
    ></main>


    <!-- SALVAMENTO -->
    <div
      id="save-bar"
      class="save-bar"
    >

      <span
        id="save-status"
        class="save-status"
      ></span>

      <button
        id="save-btn"
        onclick="saveCharacterData()"
        class="save-btn"
        disabled
      >

        <i
          data-lucide="save"
          class="w-4 h-4"
        ></i>

        <span>
          Salvar
        </span>

      </button>

    </div>

  </div>


  <!-- DADOS DAS HABILIDADES -->
  <script src="skills-data.js"></script>

  <!-- LIVRO DE REGRAS: BASE MODULAR -->
  <script type="module" src="rules/index.js"></script>

  <!-- ÍCONES -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- APP -->
  <script src="app.js"></script>

</body>
</html>
